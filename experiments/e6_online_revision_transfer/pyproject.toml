[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athlesia-e6-reference"
version = "0.8.0"
description = "Bounded, auditable multi-action symbolic AML acceptance fixture"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["athlesia*"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["athlesia"]
